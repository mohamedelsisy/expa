; Non-Docker hosts: /etc/supervisor/conf.d/expa.conf. Paths assume the release is symlinked at /srv/expa/current.
[program:expa-queue]
command=php /srv/expa/current/backend/artisan queue:work redis --tries=3 --backoff=60 --max-time=3600 --max-jobs=1000 --timeout=600 --sleep=3
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=120
stopsignal=TERM
stopasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/expa/queue.log
stdout_logfile_maxbytes=0

[program:expa-scheduler]
command=php /srv/expa/current/backend/artisan schedule:work
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
redirect_stderr=true
stdout_logfile=/var/log/expa/scheduler.log
stdout_logfile_maxbytes=0
