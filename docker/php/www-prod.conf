; php-fpm pool tuning (mounted as /usr/local/etc/php-fpm.d/zz-expa.conf). Size pm.max_children = (container RAM - 128M) / ~60M.
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
request_terminate_timeout = 65s
; php-fpm status page for monitoring is NOT exposed through nginx; query it inside the network only if enabled.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
