# Redis for EXPA: cache + queue + (unused) sessions. Password is injected on the command line from REDIS_PASSWORD (never in this file).
bind 0.0.0.0
protected-mode yes
port 6379
# Queue durability: AOF so queued jobs survive a restart. Cache data is disposable but shares the instance.
appendonly yes
appendfsync everysec
save 900 1
save 300 100
# NEVER an eviction policy that drops queue keys: a queued job evicted by memory pressure is lost silently.
maxmemory-policy noeviction
maxmemory 384mb
tcp-keepalive 60
timeout 0
