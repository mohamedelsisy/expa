# EXPA edge nginx (production/staging). Main context; site config is rendered from templates/ by the nginx image (envsubst).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;

    # Log format without query strings (they can carry signed tokens) and without cookies/authorization.
    log_format expa '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time host=$host';
    access_log /var/log/nginx/access.log expa;

    # --- compression (brotli needs the ngx_brotli module, not in the stock image: gzip only here; the CDN may add brotli) ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # --- rate limiting (edge, per client IP; the application also throttles per user/route) ---
    # If an outer CDN/load balancer is in front, uncomment and set its CIDRs so $remote_addr is the real client:
    #   set_real_ip_from 10.0.0.0/8;  real_ip_header X-Forwarded-For;  real_ip_recursive on;
    limit_req_zone $binary_remote_addr zone=expa_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=expa_api:20m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=expa_web:20m  rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=expa_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;


    include /etc/nginx/conf.d/*.conf;
}
